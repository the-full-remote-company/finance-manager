name: Dependency audit

# The "Dependency vulnerability scan" job in ci.yml only runs when somebody
# pushes. An advisory published while the repository is idle would go unseen
# until the next push, so the same scan also runs on a schedule (feature 001,
# T154; ADR 0012). It is the primary vulnerability scanner for this repository:
# GitHub's own Dependabot alerts cannot read this repository's pnpm lockfile
# format (ADR 0012), so this job is not a duplicate of them.
#
# It does not open issues or pull requests. A red run is the signal; the fix is
# a dependency bump (usually one Dependabot has already proposed) or, for a
# transitive package, an entry under `overrides` in pnpm-workspace.yaml.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity. Dependabot's own pull requests count as activity, but if this job
# stops appearing in the Actions tab, re-enable it there.
on:
  schedule:
    # Weekdays, 05:17 UTC. Off the hour on purpose: GitHub delays or drops
    # scheduled jobs at the top of the hour, when load peaks.
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency vulnerability scan (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same threshold as the pull-request gate in ci.yml. Keep the two in step.
      - run: pnpm audit --audit-level moderate
