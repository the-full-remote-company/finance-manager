services:
  db:
    image: postgres:17-alpine
    container_name: finance-db
    environment:
      # The owner role. Migrations run as this role; the application never does,
      # because row level security does not apply to a table owner or a
      # superuser (constitution, Article I).
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./packages/db/scripts/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d finance"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: finance-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      # Mailpit is a local SMTP catcher for development. No authentication needed.
      # Access web UI at http://localhost:8025
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  db-data:
